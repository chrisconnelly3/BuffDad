<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8f4f8"/>
      <stop offset="1" stop-color="#fdf6e3"/>
    </linearGradient>
    <clipPath id="scr"><rect x="0" y="0" width="276" height="592" rx="28"/></clipPath>
  </defs>
  <rect width="1100" height="720" fill="#ffffff"/>

  <!-- caption row -->
  <g font-size="17" font-weight="700" fill="#4a6878" text-anchor="middle">
    <text x="190" y="700">Home — one glance, one tap to start</text>
    <text x="550" y="700">Guided logging with big steppers</text>
    <text x="910" y="700">Coach console — review &amp; reply</text>
  </g>

  <!-- ============ PHONE 1 · HOME ============ -->
  <g transform="translate(40,30)">
    <rect width="300" height="620" rx="40" fill="#12303f"/>
    <rect x="12" y="14" width="276" height="592" rx="28" fill="url(#screen)"/>
    <rect x="118" y="24" width="64" height="11" rx="5.5" fill="#12303f"/>
    <g transform="translate(12,14)" clip-path="url(#scr)">
      <text x="18" y="52" font-size="13" font-weight="600" fill="#4a6878">Wednesday</text>
      <text x="18" y="80" font-size="26" font-weight="800" fill="#1a3c50">Time to lift.</text>

      <!-- up next card -->
      <rect x="16" y="98" width="244" height="104" rx="16" fill="#ffffff"/>
      <text x="30" y="122" font-size="11" font-weight="700" letter-spacing="1.5" fill="#1d7268">UP NEXT</text>
      <text x="30" y="150" font-size="22" font-weight="800" fill="#1a3c50">Core Day</text>
      <text x="30" y="170" font-size="12" fill="#4a6878">The abs from the photo start here.</text>
      <text x="30" y="190" font-size="12" font-weight="600" fill="#4a6878">6 exercises · about 35 min</text>

      <!-- start -->
      <rect x="16" y="214" width="244" height="52" rx="16" fill="#2a9d8f"/>
      <text x="138" y="246" font-size="17" font-weight="800" letter-spacing="1" fill="#ffffff" text-anchor="middle">START WORKOUT</text>

      <!-- stats -->
      <rect x="16" y="278" width="116" height="66" rx="14" fill="#ffffff"/>
      <text x="30" y="314" font-size="26" font-weight="800" fill="#1a3c50">12</text>
      <text x="30" y="332" font-size="11" fill="#4a6878">workouts logged</text>
      <rect x="144" y="278" width="116" height="66" rx="14" fill="#ffffff"/>
      <text x="158" y="314" font-size="26" font-weight="800" fill="#1a3c50">4</text>
      <text x="158" y="332" font-size="11" fill="#4a6878">in the last 14 days</text>

      <!-- nav -->
      <rect x="16" y="356" width="116" height="70" rx="14" fill="#ffffff"/>
      <text x="30" y="382" font-size="14" font-weight="800" fill="#1a3c50">Notes from</text>
      <text x="30" y="399" font-size="14" font-weight="800" fill="#1a3c50">Chris</text>
      <rect x="30" y="406" width="46" height="16" rx="8" fill="#1a3c50"/>
      <text x="53" y="418" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1 new</text>
      <path d="M116 384 l6 7 -6 7" stroke="#2a9d8f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="144" y="356" width="116" height="70" rx="14" fill="#ffffff"/>
      <text x="158" y="386" font-size="14" font-weight="800" fill="#1a3c50">Progress</text>
      <text x="158" y="404" font-size="12" fill="#4a6878">The Gains Report</text>
      <path d="M244 384 l6 7 -6 7" stroke="#2a9d8f" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ============ PHONE 2 · WIZARD ============ -->
  <g transform="translate(400,30)">
    <rect width="300" height="620" rx="40" fill="#12303f"/>
    <rect x="12" y="14" width="276" height="592" rx="28" fill="url(#screen)"/>
    <rect x="118" y="24" width="64" height="11" rx="5.5" fill="#12303f"/>
    <g transform="translate(12,14)" clip-path="url(#scr)">
      <text x="18" y="48" font-size="14" font-weight="800" fill="#1a3c50">‹ List</text>
      <text x="138" y="48" font-size="12" font-weight="600" fill="#4a6878" text-anchor="middle">Core Day</text>
      <text x="258" y="48" font-size="13" font-weight="700" fill="#1a3c50" text-anchor="end">2 of 6</text>

      <!-- progress -->
      <rect x="18" y="60" width="240" height="8" rx="4" fill="#eadfc9"/>
      <rect x="18" y="60" width="79" height="8" rx="4" fill="#2a9d8f"/>

      <!-- card -->
      <rect x="16" y="82" width="244" height="440" rx="18" fill="#ffffff"/>
      <circle cx="138" cy="132" r="36" fill="#e8f4f8"/>
      <g transform="translate(138,132)" stroke="#1a3c50" stroke-width="4" fill="none" stroke-linecap="round">
        <rect x="-20" y="-4" width="10" height="8" rx="2" fill="#1a3c50" stroke="none"/>
        <rect x="10" y="-4" width="10" height="8" rx="2" fill="#1a3c50" stroke="none"/>
        <line x1="-10" y1="0" x2="10" y2="0"/>
        <line x1="-13" y1="-7" x2="-13" y2="7"/>
        <line x1="13" y1="-7" x2="13" y2="7"/>
      </g>
      <text x="138" y="196" font-size="21" font-weight="800" fill="#1a3c50" text-anchor="middle">Cable Wood Chop</text>
      <text x="138" y="218" font-size="12" fill="#4a6878" text-anchor="middle">Chop wood. There is no wood.</text>
      <text x="138" y="234" font-size="12" fill="#4a6878" text-anchor="middle">Chop anyway.</text>

      <!-- steppers -->
      <g text-anchor="middle">
        <text x="60" y="272" font-size="10" font-weight="700" letter-spacing="1" fill="#4a6878">SETS</text>
        <text x="138" y="272" font-size="10" font-weight="700" letter-spacing="1" fill="#4a6878">REPS</text>
        <text x="216" y="272" font-size="9" font-weight="700" letter-spacing="1" fill="#4a6878">WEIGHT (LB)</text>
      </g>
      <g font-size="16" font-weight="800" fill="#1a3c50" text-anchor="middle">
        <!-- SETS -->
        <rect x="34" y="282" width="24" height="24" rx="7" fill="#ffffff" stroke="#e8d9b5" stroke-width="2"/><text x="46" y="299">−</text>
        <text x="72" y="300" font-size="18">3</text>
        <rect x="86" y="282" width="24" height="24" rx="7" fill="#ffffff" stroke="#e8d9b5" stroke-width="2"/><text x="98" y="299">+</text>
        <!-- REPS -->
        <rect x="112" y="282" width="24" height="24" rx="7" fill="#ffffff" stroke="#e8d9b5" stroke-width="2"/><text x="124" y="299">−</text>
        <text x="150" y="300" font-size="18">10</text>
        <rect x="164" y="282" width="24" height="24" rx="7" fill="#ffffff" stroke="#e8d9b5" stroke-width="2"/><text x="176" y="299">+</text>
        <!-- WEIGHT -->
        <rect x="190" y="282" width="24" height="24" rx="7" fill="#ffffff" stroke="#e8d9b5" stroke-width="2"/><text x="202" y="299">−</text>
        <text x="228" y="300" font-size="18">25</text>
        <rect x="242" y="282" width="24" height="24" rx="7" fill="#ffffff" stroke="#e8d9b5" stroke-width="2"/><text x="254" y="299">+</text>
      </g>

      <!-- done -->
      <rect x="32" y="334" width="212" height="52" rx="16" fill="#2a9d8f"/>
      <text x="138" y="366" font-size="17" font-weight="800" fill="#ffffff" text-anchor="middle">DONE — NEXT</text>
      <text x="70" y="410" font-size="13" font-weight="700" fill="#1d7268" text-anchor="middle">How do I do this?</text>
      <text x="206" y="410" font-size="13" font-weight="700" fill="#4a6878" text-anchor="middle">Skip this one</text>
    </g>
  </g>

  <!-- ============ PHONE 3 · COACH ============ -->
  <g transform="translate(760,30)">
    <rect width="300" height="620" rx="40" fill="#12303f"/>
    <rect x="12" y="14" width="276" height="592" rx="28" fill="url(#screen)"/>
    <rect x="118" y="24" width="64" height="11" rx="5.5" fill="#12303f"/>
    <g transform="translate(12,14)" clip-path="url(#scr)">
      <text x="18" y="48" font-size="20" font-weight="800" fill="#1a3c50">Coach Console</text>
      <text x="18" y="68" font-size="12" font-weight="600" fill="#4a6878">12 reports filed.</text>

      <!-- workout card -->
      <rect x="16" y="84" width="244" height="404" rx="16" fill="#ffffff"/>
      <text x="30" y="112" font-size="17" font-weight="800" fill="#1a3c50">Core Day</text>
      <text x="30" y="130" font-size="11" fill="#4a6878">Sat Jul 19 · 34 min</text>
      <rect x="30" y="140" width="104" height="20" rx="10" fill="#2a9d8f"/>
      <text x="82" y="154" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Felt: Just right</text>

      <!-- table -->
      <line x1="30" y1="174" x2="246" y2="174" stroke="#e8f4f8" stroke-width="1.5"/>
      <text x="30" y="192" font-size="12" font-weight="600" fill="#1a3c50">Cable Wood Chop</text>
      <text x="150" y="192" font-size="11" fill="#4a6878">3×10</text>
      <text x="188" y="192" font-size="11" fill="#4a6878">40 lb</text>
      <text x="246" y="192" font-size="12" font-weight="700" fill="#1d7268" text-anchor="end">+5 lb</text>
      <line x1="30" y1="204" x2="246" y2="204" stroke="#e8f4f8" stroke-width="1.5"/>
      <text x="30" y="222" font-size="12" font-weight="600" fill="#1a3c50">Pallof Press</text>
      <text x="150" y="222" font-size="11" fill="#4a6878">3×12</text>
      <text x="188" y="222" font-size="11" fill="#4a6878">15 lb</text>
      <text x="246" y="222" font-size="12" fill="#4a6878" text-anchor="end">→</text>

      <text x="30" y="250" font-size="11" font-style="italic" fill="#4a6878">Dad says: “Felt strong today.”</text>

      <!-- reply -->
      <rect x="30" y="264" width="216" height="52" rx="10" fill="#ffffff" stroke="#e8d9b5" stroke-width="2"/>
      <text x="42" y="286" font-size="11" fill="#8aa0ad">Tell him what you saw…</text>
      <rect x="30" y="326" width="216" height="46" rx="12" fill="#2a9d8f"/>
      <text x="138" y="354" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">Send note</text>
    </g>
  </g>
</svg>
