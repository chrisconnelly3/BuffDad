# fly.toml app configuration file generated for buffdad on 2026-07-20T08:19:36-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'buffdad'
primary_region = 'ewr'

[build]
[env]
  DB_PATH = '/data/buffdad.db'
  PORT = '8787'

[[mounts]]
  source = 'buffdad_data'
  destination = '/data'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
